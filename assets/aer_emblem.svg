<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!--
    Emblème ORIGINAL créé pour ce prototype (pas le logo officiel de l'AER :
    aucune version numérique fiable n'a été trouvée en ligne — voir le
    message envoyé à l'utilisateur à ce sujet). À remplacer par le vrai
    logo via st.logo() dès qu'un fichier officiel est fourni
    (voir utils/ui.py :: BRAND_LOGO_ICON).
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4A74"/>
      <stop offset="100%" stop-color="#082A46"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="46" fill="url(#bg)" stroke="#C9A24B" stroke-width="2"/>
  <g transform="translate(48,46)">
    <path d="M -6 -26 L 10 -2 L -1 -2 L 7 22 L -14 -4 L -3 -4 Z"
          fill="#C9A24B" stroke="#8A6E2E" stroke-width="0.6" stroke-linejoin="round"/>
  </g>
  <text x="48" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="17" font-weight="800" fill="#FFFFFF" letter-spacing="1">AER</text>
</svg>
